apiVersion: apps/v1
kind: Deployment
metadata:
  name: weathergpt-backend
  labels:
    app: weathergpt-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weathergpt-backend
  template:
    metadata:
      labels:
        app: weathergpt-backend
    spec:
      containers:
      - name: weathergpt-backend
        image: weathergpt-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: CORS_ORIGINS
          value: "*"
---
apiVersion: v1
kind: Service
metadata:
  name: weathergpt-backend-svc
spec:
  selector:
    app: weathergpt-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weathergpt-frontend
  labels:
    app: weathergpt-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weathergpt-frontend
  template:
    metadata:
      labels:
        app: weathergpt-frontend
    spec:
      containers:
      - name: weathergpt-frontend
        image: weathergpt-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: weathergpt-frontend-svc
spec:
  selector:
    app: weathergpt-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
